name: Sync resume web metadata for review branch

on:
  push:
    branches:
      - agent/resume-positioning-20260901
    paths:
      - .github/workflows/sync-resume-web.yml

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[resume-web-synced]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/resume-positioning-20260901

      - name: Align page metadata and cache versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changes = {
              Path('resume/index.html'): [
                  ('<title>缪东旭 | 机器人系统与具身智能简历</title>', '<title>缪东旭 | 机器人系统技术负责人简历</title>'),
                  ('<meta name="description" content="缪东旭的中文简历：机器人系统与具身智能，复杂系统交付、模型到真机、数据评测与团队建设。" />', '<meta name="description" content="缪东旭的中文简历：机器人系统技术负责人，系统工程与交付、数据评测、模型后训练、微调与真机适配。" />'),
                  ('<meta property="og:title" content="缪东旭 | 机器人系统与具身智能简历" />', '<meta property="og:title" content="缪东旭 | 机器人系统技术负责人简历" />'),
                  ('<meta property="og:description" content="7 年多自动驾驶与机器人研发经验；机器人系统交付、具身模型微调与真机适配、数据评测和团队建设。" />', '<meta property="og:description" content="机器人系统技术负责人；系统工程与稳定交付为主线，数据评测、模型后训练、微调与真机适配为技术纵深。" />'),
                  ('<p>机器人系统与具身智能｜职业定位：机器人系统技术负责人</p>', '<p>机器人系统技术负责人｜Hands-on Technical Lead</p>'),
                  ('<script src="./resume-data.js?v=20260827"></script>', '<script src="./resume-data.js?v=20260901"></script>'),
              ],
              Path('resume/en.html'): [
                  ('<title>Miao Dongxu | Robotics Systems & Embodied Intelligence</title>', '<title>Miao Dongxu | Robotics Systems Technical Lead</title>'),
                  ("<meta name=\"description\" content=\"Miao Dongxu's resume: robotics systems, embodied intelligence, model deployment, evaluation, and team leadership.\" />", "<meta name=\"description\" content=\"Miao Dongxu's resume: hands-on robotics systems technical leadership, systems delivery, data and evaluation, model post-training, fine-tuning, and real-robot adaptation.\" />"),
                  ('<meta property="og:title" content="Miao Dongxu | Robotics Systems & Embodied Intelligence" />', '<meta property="og:title" content="Miao Dongxu | Robotics Systems Technical Lead" />'),
                  ('<meta property="og:description" content="Robotics systems engineering, embodied models, evaluation, and team leadership." />', '<meta property="og:description" content="Hands-on robotics systems technical leadership, with data/evaluation and model post-training as technical depth." />'),
                  ('<p>Robotics Systems & Embodied Intelligence</p>', '<p>Robotics Systems Technical Lead · Hands-on Technical Lead</p>'),
                  ('<script src="./resume-en-data.js?v=20260827"></script>', '<script src="./resume-en-data.js?v=20260901"></script>'),
              ],
          }

          for path, replacements in changes.items():
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          assert 'resume-data.js?v=20260901' in Path('resume/index.html').read_text(encoding='utf-8')
          assert 'resume-en-data.js?v=20260901' in Path('resume/en.html').read_text(encoding='utf-8')
          PY

      - name: Commit pages and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/sync-resume-web.yml
          git add resume/index.html resume/en.html
          git commit -m "fix(resume): align web metadata and cache version [resume-web-synced]"
          git push origin HEAD:agent/resume-positioning-20260901
