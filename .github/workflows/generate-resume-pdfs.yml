name: Generate resume PDFs for review branch

on:
  push:
    branches:
      - agent/resume-positioning-20260901
    paths:
      - resume/resume-data.js
      - resume/resume-en-data.js
      - resume/print.html
      - resume/print-en.html
      - .github/workflows/generate-resume-pdfs.yml

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[resume-pdf-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/resume-positioning-20260901

      - name: Install PDF validation fonts and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils

      - name: Generate Chinese and English PDFs
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "No Chromium-compatible browser found on the runner" >&2
            exit 1
          fi

          python3 -m http.server 8000 >/tmp/resume-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/resume/print.html >/dev/null && break
            sleep 1
          done

          "$chrome" \
            --headless \
            --disable-gpu \
            --no-sandbox \
            --no-pdf-header-footer \
            --print-to-pdf="$PWD/resume/miao-dongxu-resume-zh-2026-09.pdf" \
            http://127.0.0.1:8000/resume/print.html
          cp resume/miao-dongxu-resume-zh-2026-09.pdf \
            resume/miao-dongxu-resume-zh.pdf

          "$chrome" \
            --headless \
            --disable-gpu \
            --no-sandbox \
            --no-pdf-header-footer \
            --print-to-pdf="$PWD/resume/miao-dongxu-resume-en-2026-09.pdf" \
            http://127.0.0.1:8000/resume/print-en.html
          cp resume/miao-dongxu-resume-en-2026-09.pdf \
            resume/miao-dongxu-resume-en.pdf

      - name: Validate and commit generated PDFs
        run: |
          set -euo pipefail
          test "$(pdfinfo resume/miao-dongxu-resume-zh-2026-09.pdf | awk '/^Pages:/ {print $2}')" = "2"
          test "$(pdfinfo resume/miao-dongxu-resume-en-2026-09.pdf | awk '/^Pages:/ {print $2}')" = "2"
          cmp resume/miao-dongxu-resume-zh-2026-09.pdf resume/miao-dongxu-resume-zh.pdf
          cmp resume/miao-dongxu-resume-en-2026-09.pdf resume/miao-dongxu-resume-en.pdf

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/generate-resume-pdfs.yml
          git add \
            resume/miao-dongxu-resume-zh-2026-09.pdf \
            resume/miao-dongxu-resume-zh.pdf \
            resume/miao-dongxu-resume-en-2026-09.pdf \
            resume/miao-dongxu-resume-en.pdf
          git commit -m "build(resume): regenerate 2026-09 PDFs [resume-pdf-generated]"
          git push origin HEAD:agent/resume-positioning-20260901
